[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winkam"
version = "0.0.0"
description = "Windows Sistem Temizlik ve Optimizasyon Araci (Python CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "WinKam contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
winkam = "winkam.cli:main"

[tool.setuptools]
package-dir = {"" = "py-src"}

[tool.setuptools.packages.find]
where = ["py-src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=winkam --cov-report=term-missing"

[tool.coverage.run]
source = ["winkam"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"py-src/winkam/cleaner.py" = ["E501", "UP028"]  # pre-existing long powershell command strings / yield loop
"tests/*" = ["E501", "B017"]  # test lines with long fixture signatures; blind Exception is intentional
