name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python (lint, unit, security)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev/test deps
        run: python -m pip install -e ".[dev]"
      - name: Ruff (code quality)
        run: python -m ruff check py-src tests
      - name: Pytest (unit + functional + coverage)
        run: python -m pytest
      - name: pip-audit (dependency security)
        run: python -m pip_audit
        continue-on-error: true

  ui-unit-tests:
    name: UI (lint, unit, component, a11y)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint (code quality)
        run: npm run lint
      - name: Vitest (unit + component + integration + a11y, with coverage)
        run: npm run test:coverage
      - name: npm audit (dependency security)
        run: npm audit --audit-level=high
        continue-on-error: true

  ui-e2e-tests:
    name: UI (E2E, visual, responsive, cross-browser, perf)
    runs-on: windows-latest
    needs: ui-unit-tests
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Playwright E2E suite (chromium, firefox, webkit, mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
